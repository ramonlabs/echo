[project]
name = "echo-common"
version = "0.1.0"
description = "Shared utilities for echo services"
requires-python = ">=3.11"
dependencies = [
    "colorlog>=6.10.1",
    "httpx>=0.27.0",
    "mistune>=3.2.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_common"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "RUF", "PIE", "TRY", "PERF", "PLR2004"]
ignore = ["RUF001", "RUF010", "TRY003", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG", "RUF012", "PLR2004"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
